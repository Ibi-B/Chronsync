name: Validate EPG Build

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-and-build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Fetch Raw Data
        env:
          FEED_URL: https://iptv-org.github.io/epg/guides/us/pluto.tv.epg.xml
        run: |
          mkdir -p raw_data
          curl --fail --location --show-error \
            "$FEED_URL" \
            -o raw_data/source1.xml

      - name: Install Dependencies
        run: pip install -r scripts/requirements.txt

      - name: Validate EPG Feed
        run: python scripts/validate_epg.py raw_data/source1.xml

      - name: Compile SQLite Database
        run: python scripts/build_sqlite.py

      - name: Upload Database Artifact
        uses: actions/upload-artifact@v4
        with:
          name: chronsync-timeline-sqlite
          path: public/timeline.sqlite3
          if-no-files-found: error
