name: Validate EPG Build

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-and-build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: pip install -r scripts/requirements.txt

      - name: Run Validator Tests
        run: python -m unittest discover -s tests -v

      - name: Prepare Fixture Feed
        run: |
          mkdir -p raw_data
          cp tests/fixtures/sample_epg.xml raw_data/source1.xml

      - name: Validate Fixture Feed
        run: python scripts/validate_epg.py raw_data/source1.xml

      - name: Compile SQLite Database
        run: python scripts/build_sqlite.py

      - name: Upload Fixture Database Artifact
        uses: actions/upload-artifact@v4
        with:
          name: chronsync-fixture-timeline-sqlite
          path: public/timeline.sqlite3
          if-no-files-found: error
